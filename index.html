<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bill Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column. The Month tab splits into a wide bill checklist and a narrow income column;
   every other tab is stacked full-width cards. Ink-blue accent, semantic green/amber/red for bill state only. */
:root {
  --bg: #edf0f5;
  --surface: #fcfcfd;
  --surface-2: #f2f5f9;
  --ink: #101a28;
  --ink-2: #465264;
  --muted: #5f6b7c;
  --line: #d9dee7;
  --line-2: #e7eaf0;
  --accent: #1c5cab;
  --accent-ink: #ffffff;
  --accent-soft: #e2ecf9;
  --accent-line: #b7cfee;
  --good: #0a7a3a;
  --good-soft: #dff3e6;
  --warn: #8a5600;
  --warn-soft: #fbefcf;
  --bad: #b3262b;
  --bad-soft: #fbe3e3;
  --s1: #2a78d6;
  --s2: #eb6834;
  --warn-fill: #d99a1c;
  --shadow: 0 1px 2px rgba(16, 26, 40, .06), 0 6px 18px rgba(16, 26, 40, .05);
  --f-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121a; --surface: #151c27; --surface-2: #1b2432; --ink: #e9eef6; --ink-2: #b2bdcc; --muted: #8c98aa;
    --line: #2a3445; --line-2: #222b3a; --accent: #74abf0; --accent-ink: #0a1523; --accent-soft: #18283f; --accent-line: #2c4a73;
    --good: #52c585; --good-soft: #143324; --warn: #e7b44f; --warn-soft: #35290f; --bad: #ff8585; --bad-soft: #3b1a1c;
    --s1: #3987e5; --s2: #d95926; --warn-fill: #e7b44f; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121a; --surface: #151c27; --surface-2: #1b2432; --ink: #e9eef6; --ink-2: #b2bdcc; --muted: #8c98aa;
  --line: #2a3445; --line-2: #222b3a; --accent: #74abf0; --accent-ink: #0a1523; --accent-soft: #18283f; --accent-line: #2c4a73;
  --good: #52c585; --good-soft: #143324; --warn: #e7b44f; --warn-soft: #35290f; --bad: #ff8585; --bad-soft: #3b1a1c;
  --s1: #3987e5; --s2: #d95926; --warn-fill: #e7b44f; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { max-width: 1080px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 72px; }

/* header + tabs */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
.brand svg { flex: none; }
.top-r { display: flex; align-items: center; gap: 8px; min-width: 0; }
.save { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.save::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.save.busy::before { background: var(--warn); }
.save.ro::before { background: var(--accent); }
.save.err { color: var(--bad); }
.save.err::before { background: var(--bad); }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; gap: 4px; background: var(--bg); padding-block: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { flex: 1 1 0; min-width: max-content; border: 0; background: none; padding: 10px 14px; font-weight: 600; font-size: 14.5px; color: var(--ink-2); border-radius: 10px; }
.tab:hover { background: var(--surface-2); }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 520px) { .tabs { gap: 2px; } .tab { padding: 10px 8px; font-size: 14px; min-width: 0; } }
@media (min-width: 720px) { .tab { flex: 0 0 auto; padding-inline: 22px; } }

/* generic */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 18px 10px; }
.card-h h2 { font-size: 18px; }
.card-b { padding: 6px 18px 18px; }
.stack { display: grid; gap: 16px; min-width: 0; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.pagehead h1 { font-size: 28px; }
.lede { color: var(--ink-2); max-width: 60ch; margin-top: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 14px; font-weight: 600; font-size: 14px; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.sm { min-height: 34px; padding: 6px 11px; font-size: 13px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); }
.btn.ghost.bad { color: var(--bad); }
.sheet-more { border-top: 1px solid var(--line-2); padding-top: 8px; gap: 2px 6px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); margin-bottom: 14px; font-size: 14px; }
.banner.info { background: var(--accent-soft); border-color: var(--accent-line); }
.empty { text-align: center; padding: 36px 20px; display: grid; gap: 10px; justify-items: center; }
.empty h3 { font-size: 18px; }
.empty p { color: var(--ink-2); max-width: 46ch; }

/* month bar + summary */
.monthbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.mtitle { font-size: 28px; min-width: 7ch; flex: 0 1 auto; }
.monthbar .grow { flex: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { padding: 16px 18px; border-left: 1px solid var(--line-2); min-width: 0; }
.stat:first-child { border-left: 0; }
@media (max-width: 520px) { .stats:not(.three) .stat:nth-child(odd) { border-left: 0; } .stats:not(.three) .stat:nth-child(n+3) { border-top: 1px solid var(--line-2); } }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 520px) { .stats.three .stat { padding: 14px 10px 14px 12px; } .stats.three .stat .val { font-size: 19px; } .stats.three .stat .sub { font-size: 12px; } .stats.three .stat .lbl { font-size: 11px; letter-spacing: .04em; } }
.stat .lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat .val { font-family: var(--f-display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; overflow-wrap: anywhere; }
.stat .sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.stat.lead .val { color: var(--accent); }
.stat .val.neg { color: var(--bad); }
.progress { padding: 0 18px 16px; }
.track { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line-2); overflow: hidden; display: flex; }
.track > i { display: block; height: 100%; background: var(--good); }
.progress .cap { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); margin-top: 6px; flex-wrap: wrap; }

.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); margin-top: 16px; align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); } }

/* checklist rows */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 8px; padding: 2px 10px 2px 18px; border-top: 1px solid var(--line-2); }
.list > .row:first-child { border-top: 1px solid var(--line-2); }
.chk { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); background: var(--surface); display: grid; place-items: center; padding: 0; color: transparent; flex: none; }
.chk:hover:not([disabled]) { border-color: var(--accent); }
.chk[disabled] { cursor: default; }
.chk[aria-checked="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.chk svg { width: 16px; height: 16px; }
.rmain { text-align: left; background: none; border: 0; padding: 10px 8px; min-width: 0; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: center; border-radius: 10px; }
button.rmain:hover { background: var(--surface-2); }
.rtext { display: grid; gap: 1px; min-width: 0; }
.grp { padding: 10px 18px 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-top: 1px solid var(--line-2); list-style: none; }
.alldone { padding: 14px 18px; color: var(--ink-2); list-style: none; }
.radios { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.radios legend { padding: 0; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.checkline input[type=radio] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
details.more { border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; }
details.more summary { cursor: pointer; padding: 11px 0; font-weight: 600; font-size: 14px; color: var(--accent); }
.more-b { display: grid; gap: 14px; padding: 4px 0 14px; }
.bankbar { display: flex; justify-content: space-between; align-items: center; gap: 10px 12px; flex-wrap: wrap; margin-bottom: 16px; }
.rname { font-weight: 600; overflow-wrap: anywhere; }
.rmeta { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ramt { font-family: var(--f-data); font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; white-space: nowrap; }
.row.paid .rname, .row.paid .ramt { color: var(--muted); }
.row.paid .rname { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.row.skip .rname, .row.skip .ramt { color: var(--muted); font-style: italic; }
.row.late .due { color: var(--bad); font-weight: 600; }
.row.soon .due { color: var(--warn); font-weight: 600; }
.card-f { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line-2); font-size: 14px; }
.card-f .total { font-weight: 600; }

/* spending budgets */
.brow { padding: 14px 18px 16px; border-top: 1px solid var(--line-2); display: grid; gap: 10px; }
.bhead { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.bnum { font-size: 16px; font-weight: 500; }
.bbar { height: 12px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line-2); overflow: hidden; }
.bbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; min-width: 0; }
.brow.near .bbar i { background: var(--warn-fill); }
.brow.over .bbar i { background: var(--bad); }
.brow.over .bnum, .brow.over .bnum .muted { color: var(--bad); }
.bsub { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.spendf { display: flex; flex-wrap: wrap; gap: 8px; }
.spendf .inp { width: auto; min-width: 0; }
.spendf input[name=amount] { flex: 1 1 110px; max-width: 150px; }
.spendf input[name=note] { flex: 2 1 150px; }
.spendf input[name=date] { flex: 0 1 150px; }
.entries { list-style: none; margin: 0; padding: 0; display: grid; }
.entries li { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto 36px; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid var(--line-2); font-size: 14px; }
.entries .enote { overflow-wrap: anywhere; color: var(--ink-2); }
.entries .btn { min-height: 30px; padding: 0 8px; }
.bentries { display: grid; gap: 2px; }

/* quick income entry */
.incf { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 14px; }
.incf .inp { width: auto; min-width: 0; }
.incf input[name=source] { flex: 2 1 150px; }
.incf input[name=amount] { flex: 1 1 100px; max-width: 140px; }
.incf input[name=date] { flex: 0 1 150px; }
/* check planner */
.planf { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 14px; }
.planf .inp { width: auto; flex: 1 1 160px; max-width: 240px; min-width: 0; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 0 18px 16px; font-size: 13.5px; }
.chip { border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 13.5px; }
.chip:hover { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line-2); }
.ptxt { display: grid; gap: 1px; min-width: 0; }
.pright { display: grid; justify-items: end; gap: 1px; }
.pright .ramt { font-weight: 500; }
.pbal { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pbal.neg { color: var(--bad); font-weight: 600; }
.neg-t { color: var(--bad); font-weight: 600; }
.prow.late .due { color: var(--bad); font-weight: 600; }
.prow.soon .due { color: var(--warn); font-weight: 600; }

/* forms */
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); min-width: 0; }
.field input, .field select, .field textarea, .inp {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
  font-weight: 400; font-size: 15px; min-height: 40px;
}
.field textarea { min-height: 70px; resize: vertical; }
.field small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.inp.sm { min-height: 34px; padding: 5px 8px; font-size: 14px; width: auto; max-width: 100%; }
.checkline { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; font-weight: 500; color: var(--ink); }
.checkline input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.field .checkline { align-items: center; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

/* obligations */
.orow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line-2); padding: 11px 18px; }
button.orow:hover { background: var(--surface-2); }
div.orow { cursor: default; }
.orow .rname { font-weight: 600; }
.orow .eq { font-size: 12.5px; color: var(--muted); text-align: right; }
.cbar { display: grid; grid-template-columns: minmax(84px, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; width: 100%; background: none; border: 0; text-align: left; border-radius: 8px; }
button.cbar:hover { background: var(--surface-2); }
.cbar .nm { font-size: 14px; overflow-wrap: anywhere; }
.cbar .bar { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.cbar .bar i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
.cbar .amt { font-family: var(--f-data); font-variant-numeric: tabular-nums; font-size: 13.5px; text-align: right; white-space: nowrap; }
.cbar .amt small { color: var(--muted); margin-left: 6px; }

/* statements */
.drop { border: 2px dashed var(--accent-line); background: var(--accent-soft); border-radius: 14px; padding: 22px 18px; display: grid; gap: 8px; justify-items: center; text-align: center; }
.drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.drop h3 { font-size: 18px; }
.drop p { color: var(--ink-2); font-size: 14px; max-width: 58ch; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 14px; font-weight: 600; font-size: 14px; color: var(--ink-2); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.desc { min-width: 160px; overflow-wrap: anywhere; }
.tbl tr:last-child td { border-bottom: 0; }
.out { color: var(--ink); }
@media (max-width: 640px) {
  .tbl.stk thead { display: none; }
  .tbl.stk, .tbl.stk tbody { display: block; }
  .tbl.stk tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "date amt" "desc desc" "cat act"; gap: 4px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line-2); align-items: center; }
  .tbl.stk td { padding: 0; border: 0; min-width: 0; }
  .tbl.stk .c-date { grid-area: date; color: var(--muted); font-size: 13px; }
  .tbl.stk .c-amt { grid-area: amt; font-weight: 500; }
  .tbl.stk .c-desc { grid-area: desc; min-width: 0; }
  .tbl.stk .c-cat { grid-area: cat; }
  .tbl.stk .c-cat select { width: 100%; }
  .tbl.stk .c-act { grid-area: act; }
  .tbl.stk tr.off td { opacity: .45; }
}
.in { color: var(--good); }

function reconcileMonth() {

  const mtx = D.txns.filter(t => ymOf(t.date) === ym);

  const out = sum(mtx.filter(t => t.amt < 0 && t.cat !== 'Transfer'), t => -t.amt), inn = sum(mtx.filter(t => t.amt > 0 && t.cat === 'Income'), t => t.amt);

const RANGES = [['this', 'This month'], ['last', 'Last month'], ['3', 'Last 3 months'], ['6', 'Last 6 months'], ['12', 'Last 12 months'], ['all', 'All time']];
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function roundTop(x, y, w, h, r) { r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function monthChart(by, W) {
  const ms = Object.keys(by), H = 230, L = 46, R = 4, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
  const max = Math.max(1, ...ms.flatMap(m => [by[m].in, by[m].out])), step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = v => T + ph - v / top * ph, gw = pw / ms.length, bw = Math.min(28, gw * .34);
  let g = '';
  for (let v = 0; v <= top + 1e-6; v += step) g += `<line class="${v === 0 ? 'axis' : 'grid'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${moneyShort(v)}</text>`;
  ms.forEach((m, i) => {
    const cx = L + gw * i + gw / 2, d = by[m];
    const tip = esc(JSON.stringify({ t: fmtMonth(m), rows: [['Money in', money(d.in), 's1'], ['Spent', money(d.out), 's2'], ['Net', money(d.in - d.out, { sign: true }), '']] }));
    if (d.in > 0) g += `<path d="${roundTop(cx - bw - 1, y(d.in), bw, y(0) - y(d.in), 4)}" fill="var(--s1)"/>`;
    if (d.out > 0) g += `<path d="${roundTop(cx + 1, y(d.out), bw, y(0) - y(d.out), 4)}" fill="var(--s2)"/>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${fmtMon(m)}</text><rect class="hit" x="${cx - gw / 2}" y="${T}" width="${gw}" height="${ph + B}" data-tip="${tip}"/>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and money spent by month">${g}</svg>`;
}
function viewSpending() {

  tip.hidden = false;

async function saveFile(name, text, mime) {

    }
  } catch (e) { if (e && e.code === 'declined') return; if (window.claude) return showText(name, text); }

}
function showText(name, text) {

function submitTemplate() {
  readTmplForm();

  if (TF.budget && !TF.name) { toast('Add a name and a monthly budget.'); return; }
  if (!TF.name || isNaN(amount) || amount < 0) { toast('Add a name and an amount.'); return; }
  if ((TF.freq === 'weekly' || TF.freq === 'biweekly') && !TF.anchor) { toast('Pick a date it lands on.'); return; }
  const ok = /^\d{4}-\d{2}$/;
  const obj = { type: TF.type, name: TF.name, amount: r2(amount), category: TF.type === 'income' ? 'Income' : (TF.category && TF.category !== 'Other' ? TF.category : (TF.editing ? 'Other' : guessCategory(TF.name))), freq: TF.budget ? 'monthly' : TF.freq, day: TF.budget ? 1 : Math.min(31, Math.max(1, TF.day || 1)), day2: Math.min(31, Math.max(1, TF.day2 || 15)), anchor: TF.anchor, month: TF.month || 1, match: TF.match, start: ok.test(TF.start || '') ? TF.start : '', end: ok.test(TF.end || '') ? TF.end : '' };
  for (const k of ['anchor', 'start', 'end', 'match']) if (!obj[k]) delete obj[k];
  if (TF.budget) obj.budget = true;
  let t;
  if (TF.editing) {
    t = D.templates.find(x => x.id === TF.id);
    // amount and due day(s) keep a history; changing how often it repeats applies to every month
    const fields = ['amount', 'day', 'day2', 'anchor'], eff = f => fieldFor(t, TF.ctx, f);
    const prev = Object.fromEntries(fields.map(f => [f, eff(f)])), next = Object.fromEntries(fields.map(f => [f, obj[f]]));
    const rest = { ...obj }; fields.forEach(f => { delete rest[f]; });
    const freqChanged = obj.freq !== t.freq || (obj.month || 1) !== (t.month || 1), everywhere = freqChanged || TF.apply === 'all';
    // only the fields that matter for how often it repeats are compared, so unrelated defaults never land in the history
    const relevant = ['amount', ...(obj.freq === 'twice' ? ['day', 'day2'] : obj.freq === 'weekly' || obj.freq === 'biweekly' ? ['anchor'] : ['day'])];
    const setBase = (f, v) => { if (v === undefined) delete t[f]; else t[f] = v; clearField(t, f); };

      for (const k of ['start', 'end', 'match', 'autopay', 'budget']) delete t[k];

}

function recordIncome(name, amount, date) {
  if (!name || isNaN(amount) || amount <= 0) { toast('Enter a source and an amount.'); return; }
  const ym = ymOf(date), got = r2(amount), received = date <= todayStr();
  const near = i => Math.abs(dayNum(i.due) - dayNum(date));
  const expected = received ? itemsFor(ym).filter(i => i.type === 'income' && i.rec && !i.done && !i.skip && normText(i.name) === normText(name) && near(i) <= 12).sort((a, b) => near(a) - near(b))[0] : null;
  const where = ym !== UI.ym ? ` in ${fmtMonth(ym)}` : '';
  const again = () => { if (!matchMedia('(pointer: coarse)').matches) { const n = $('.incf input[name=source]'); if (n) n.focus(); } };
  if (expected) {
    const prev = { done: false, date: null, amount: expected.amount === expected.planned ? null : expected.amount };
    mutateItem(ym, expected, { done: true, date, amount: got === expected.planned ? null : got });
    render(); again();
    toast(`Ticked off ${expected.name} (${money(got)})${where}.`, { action: 'Undo', fn: () => { const it = itemsFor(ym).find(i => i.key === expected.key); if (it) { mutateItem(ym, it, prev); render(); } } });
    return;
  }
  const x = { id: uid('x'), type: 'income', name, amount: got, date, category: 'Income' };
  if (received) { x.done = true; x.doneDate = date; }
  ensureMonth(ym).extras.push(x); touchMonth(ym);
  render(); again();
  toast(`${received ? 'Added' : 'Expecting'} ${money(got)} from ${name}${where}.`, { action: 'Undo', fn: () => { const mo = D.months[ym]; if (mo) { mo.extras = mo.extras.filter(e => e.id !== x.id); touchMonth(ym); render(); } } });
}

/* ---------- statement import ---------- */
let IM = null, IMQ = [], IMN = 0, IMSTAT = { added: 0, files: 0, months: {} };
async function prepareFile(f) {
  const ext = f.name.split('.').pop().toLowerCase();

    const lines = await extractPdfLines(await f.arrayBuffer());
    const r = parsePdfLines(lines);
    if (!r.txns.length) throw new Error('no transactions found in this PDF. Download the CSV version from your bank if it offers one');
    return { name: f.name, kind: 'pdf', txns: r.txns };
  }
  const text = await f.text();
  if (ext === 'ofx' || ext === 'qfx' || /<OFX>|<STMTTRN>/i.test(text)) {
    const txns = parseOFX(text);
    if (!txns.length) throw new Error('no transactions found');
    return { name: f.name, kind: 'ofx', txns };
  }
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error('the file looks empty');
  return Object.assign({ name: f.name, kind: 'csv' }, analyzeCSV(rows));
}
async function handleFiles(list) {
  const files = [...list];
  if (!files.length) return;
  toast(`Reading ${plural(files.length, 'file')}…`, { ms: 20000 });
  const prepared = [], errors = [];
  for (const f of files) { try { prepared.push(await prepareFile(f)); } catch (err) { errors.push(`${f.name}: ${err.message || err}`); } }
  if (errors.length) toast(errors.join(' · '), { ms: 10000 }); else $('#toast').hidden = true;

  nextImport();
}
function nextImport() {

  recomputeImport();
  openImportDialog();
}
function recomputeImport() {
  const f = IM.file;

  else txns = f.txns.map(t => ({ ...t, amt: IM.flip ? -t.amt : t.amt }));

}
function importSummary() {

  const dates = inc.map(r => r.date).sort();
  return { n: inc.length, dups, text: `${plural(inc.length, 'transaction')} to import${dates.length ? ` · ${fmtShort(dates[0])} to ${fmtDate(dates[dates.length - 1])}` : ''}${dups ? ` · ${dups} already imported` : ''}${IM.bad ? ` · ${plural(IM.bad, 'row')} skipped (no date or amount)` : ''}` };
}

  const S = importSummary();

      ${m.amount < 0 || m.debit > -1 || m.credit > -1 ? sel('debit', 'Money out column', true) + sel('credit', 'Money in column', true) : ''}
      <label class="field">Date order<select data-chg="imp-datefmt"><option value="mdy"${IM.dateFmt === 'mdy' ? ' selected' : ''}>Month / Day / Year</option><option value="dmy"${IM.dateFmt === 'dmy' ? ' selected' : ''}>Day / Month / Year</option></select></label></div>` : '';

function commitImport() {
  const rows = IM.rows.filter(r => r.include);
  if (!rows.length) return;
  const id = uid('i');
  let from = '9999', to = '0000';
  for (const r of rows) {
    const t = { id: uid('t'), date: r.date, desc: r.desc, amt: r2(r.amt), src: id };
    t.cat = autoCategory(t.desc, t.amt);

    const m = ymOf(r.date); IMSTAT.months[m] = (IMSTAT.months[m] || 0) + 1;
  }
  D.txns.sort((a, b) => a.date.localeCompare(b.date));

  else if (e.target.classList.contains('incf')) submitIncome(e.target);
  else if (e.target.classList.contains('planf')) {
    const a = parseFloat(e.target.elements.amount.value), prev = D.months[UI.ym] && D.months[UI.ym].plan;
    if (isNaN(a) || a <= 0) { toast('Enter the amount you were paid.'); return; }
    setPlan(UI.ym, a, prev && prev.amount === r2(a) ? prev.source : '');
    render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });
for (const ev of ['pointermove', 'pointerdown']) {
  document.addEventListener(ev, e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e); else hideTip(); });
}
document.addEventListener('scroll', hideTip, { passive: true });

/* files: picker and drag-and-drop */
$('#file').addEventListener('change', e => { if (RO()) return; const files = [...e.target.files]; e.target.value = ''; handleFiles(files); });
document.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); } });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) { const d = $('#drop'); if (d) d.classList.remove('over'); } });
document.addEventListener('drop', e => {
  if (RO()) return;
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) { e.preventDefault(); const d = $('#drop'); if (d) d.classList.remove('over'); handleFiles(e.dataTransfer.files); }
});

let resizeT = null;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (UI.tab === 'bank' && UI.sub === 'spending' && $('#modal').hidden) render(); }, 200); });

/* ---------- start ---------- */
async function main() {
  $('#top').innerHTML = chromeHTML();
  $('#saveState').replaceWith(saveChip());
  $('#app').innerHTML = '<div class="empty"><p>Loading your ledger…</p></div>';
  await Store.init();
  $('#top').innerHTML = chromeHTML();
  $('#saveState').replaceWith(saveChip());
  const hash = location.hash.slice(1);
  let saved = null; try { saved = localStorage.getItem('billledger.tab'); } catch (e) { /* ignore */ }
  const pick = [hash, saved].find(t => visibleTabs().some(x => x[0] === (LEGACY_TABS[t] || t)));
  if (pick) { if (pick === 'spending') UI.sub = 'spending'; UI.tab = LEGACY_TABS[pick] || pick; }
  render();
}
main().catch(err => {
  $('#app').innerHTML = `<div class="empty"><h3>Could not open your ledger</h3><p>${esc(err && err.message ? err.message : err)}</p><button class="btn primary" onclick="location.reload()">Try again</button></div>`;
});

</script>
</body>
</html>
